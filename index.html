<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boss Hub - Key System</title>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        h1 { margin-bottom: 10px; color: #38bdf8; font-size: 24px; }
        p { color: #94a3b8; font-size: 14px; margin-bottom: 20px; }
        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            box-sizing: border-box;
            transition: background 0.2s;
        }
        .btn:hover { background: #2563eb; }
        .key-box {
            margin-top: 15px;
            padding: 12px;
            background: #0f172a;
            border: 1px dashed #475569;
            border-radius: 6px;
            word-break: break-all;
            font-family: monospace;
            color: #38bdf8;
            font-size: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Boss Hub Key System</h1>
        <p>Пройди короткую ссылку через Linklothbas, чтобы разблокировать ключ доступа к скрипту.</p>
        
        <!-- ВСТАВЬ СВОЮ ССЫЛКУ В КАВЫЧКИ ВМЕСТО ЭТОГО ТЕКСТА -->
        <a href="ТВОЯ_ССЫЛКА_LINKLOTHBAS_ЗДЕСЬ" class="btn" target="_blank">Получить ключ (Шаг 1)</a>
        
        <div style="margin-top: 20px;">
            <p style="margin-bottom: 8px;">Твой ключ:</p>
            <div class="key-box">BOSS-HUB-2026-RELEASE</div>
        </div>
    </div>
</body>
</html>
